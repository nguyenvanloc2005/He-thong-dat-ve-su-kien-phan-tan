services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ticket-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ticket-api:
    build:
      context: .
      dockerfile: backend/TicketApi/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__TicketDatabase: Data Source=/data/tickets.db
      RabbitMQ__Host: rabbitmq
    volumes:
      - ticket-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  booking-worker:
    build:
      context: .
      dockerfile: backend/BookingWorker/Dockerfile
    environment:
      ConnectionStrings__TicketDatabase: Data Source=/data/tickets.db
      RabbitMQ__Host: rabbitmq
    volumes:
      - ticket-data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  ticket-data:
