<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Ticketly - Hệ thống đặt vé sự kiện</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Ticketly trang chủ">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4V7Z"/><path d="M8 6v12M16 6v12"/></svg>
        </span>
        <span>Ticket<span>ly</span></span>
      </a>
      <nav class="nav-actions" aria-label="Điều hướng">
        <button class="nav-link active" type="button" data-view="events">Sự kiện</button>
        <button class="nav-link" type="button" data-view="bookings">Vé của tôi</button>
        <a class="icon-button" href="/swagger" target="_blank" rel="noopener" title="Tài liệu API" aria-label="Tài liệu API">
          <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        </a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div>
          <p class="eyebrow">KHÁM PHÁ & TRẢI NGHIỆM</p>
          <h1>Sự kiện tuyệt vời<br><span>bắt đầu từ đây</span></h1>
        </div>
        <div class="hero-art" aria-hidden="true">
          <div class="orb orb-one"></div>
          <div class="orb orb-two"></div>
          <div class="ticket-visual">
            <span>TICKETLY</span>
            <b>LIVE</b>
          </div>
        </div>
      </section>

      <section id="events-view" class="view active" aria-labelledby="events-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">ĐANG DIỄN RA</p>
            <h2 id="events-heading">Sự kiện nổi bật</h2>
          </div>
          <label class="search-box">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>
            <input id="event-search" type="search" placeholder="Tìm sự kiện..." autocomplete="off">
          </label>
        </div>
        <div id="events-loading" class="state-card">
          <span class="spinner"></span>
          <p>Đang tải sự kiện...</p>
        </div>
        <div id="event-grid" class="event-grid" aria-live="polite"></div>
      </section>

      <section id="bookings-view" class="view" aria-labelledby="bookings-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">QUẢN LÝ ĐẶT VÉ</p>
            <h2 id="bookings-heading">Vé của tôi</h2>
          </div>
        </div>
        <form id="lookup-form" class="lookup-form">
          <label for="lookup-user">Nhập mã người dùng</label>
          <div class="lookup-row">
            <input id="lookup-user" name="userId" value="user01" required maxlength="200" placeholder="Ví dụ: user01">
            <button class="primary-button" type="submit">Tra cứu vé</button>
          </div>
        </form>
        <div id="bookings-loading" class="state-card hidden">
          <span class="spinner"></span>
          <p>Đang tra cứu...</p>
        </div>
        <div id="booking-list" class="booking-list" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <dialog id="booking-dialog">
    <form id="booking-form" method="dialog">
      <button class="dialog-close" type="button" aria-label="Đóng">×</button>
      <p class="eyebrow">ĐẶT VÉ</p>
      <h2 id="dialog-event-name">Sự kiện</h2>
      <p id="dialog-event-info" class="dialog-info"></p>
      <input type="hidden" id="booking-event-id">
      <label for="booking-user">Mã người dùng</label>
      <input id="booking-user" required maxlength="200" value="user01" placeholder="Ví dụ: user01">
      <label for="booking-quantity">Số lượng vé</label>
      <input id="booking-quantity" type="number" required min="1" max="10" value="1">
      <p id="booking-error" class="form-error hidden"></p>
      <button class="primary-button wide" type="submit">
        <span>Xác nhận đặt vé</span>
      </button>
    </form>
  </dialog>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
